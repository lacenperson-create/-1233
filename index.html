<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استوديو الأنشطة</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الاستوديو">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#0f1420;--card:#1a2233;--line:#2a3550;--acc:#f5a524;--txt:#e9edf5;--mut:#8b96ad;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--txt);padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
h1{font-size:20px;margin:16px 0 4px}
.sub{color:var(--mut);font-size:13px;margin-bottom:8px}
.wrap{display:grid;grid-template-columns:1fr;gap:16px;max-width:1200px;margin:auto;padding-bottom:24px}
@media(min-width:900px){.wrap{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
h2{font-size:15px;margin:0 0 10px;color:var(--acc)}
button{background:var(--line);color:var(--txt);border:0;border-radius:9px;padding:8px 12px;font:inherit;cursor:pointer}
button.p{background:var(--acc);color:#111;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;max-height:260px;overflow:auto}
.th{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#000;cursor:pointer;border:2px solid transparent}
.th img,.th video{width:100%;height:100%;object-fit:cover;display:block}
.th .badge{position:absolute;bottom:4px;left:4px;background:#000b;font-size:11px;padding:2px 6px;border-radius:6px}
.th:hover{border-color:var(--acc)}
.clip{display:grid;grid-template-columns:72px 1fr;gap:10px;background:#121a2a;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;cursor:grab}
.clip.over{border-color:var(--acc)}
.clip img,.clip video{width:72px;height:72px;object-fit:cover;border-radius:8px;background:#000}
.clip input,.clip select{background:#0b1020;color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:5px;font:inherit;font-size:13px}
.clip input[type=text]{width:100%;margin:4px 0}
.small{font-size:12px;color:var(--mut)}
canvas{width:100%;border-radius:10px;background:#000;display:block;aspect-ratio:16/9}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
.empty{color:var(--mut);font-size:13px;padding:12px;text-align:center;grid-column:1/-1}
</style>
</head>
<body>
<div class="wrap">
  <div class="full">
    <h1>استوديو الأنشطة</h1>
    <div class="sub">ارفع صور وفيديوهات النشاط، رتّبها بالسحب، قصّ المقاطع، أضف تعليقات وفلاتر، ثم صدّر فيلمك.</div>
  </div>

  <div class="card full">
    <h2>1 · مكتبة الوسائط</h2>
    <div class="row" style="margin-bottom:10px">
      <button class="p" onclick="fi.click()">+ استيراد</button>
      <button onclick="addAll()">إضافة الكل إلى الخط الزمني</button>
      <span class="small" id="cnt"></span>
    </div>
    <input type="file" id="fi" accept="image/*,video/*" multiple hidden>
    <div id="lib"><div class="empty">لا توجد وسائط بعد — اضغط «استيراد»</div></div>
  </div>

  <div class="card">
    <h2>2 · الخط الزمني (اسحب لإعادة الترتيب)</h2>
    <div id="tl"><div class="empty">الخط الزمني فارغ — أضف وسائط من المكتبة</div></div>
    <div class="small" id="tot" style="margin-top:6px"></div>
  </div>

  <div class="card">
    <h2>3 · المعاينة والتصدير</h2>
    <canvas id="cv" width="1280" height="720"></canvas>
    <div class="bar"><i id="pb"></i></div>
    <div class="row" style="margin-top:10px">
      <button class="p" id="play" onclick="togglePlay()">▶ تشغيل</button>
      <button onclick="exportFilm()">⬇ تصدير WebM</button>
      <span class="small" id="st"></span>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id), cv=$('cv'), ctx=cv.getContext('2d'), W=cv.width, H=cv.height;
let lib=[], tl=[], uid=0, playing=false, idx=0, clipT0=0, raf=0, rec=null, chunks=[], ac=null, mix=null, dragI=-1;
const FX={none:'none',gray:'grayscale(100%)',sepia:'sepia(80%)',bright:'brightness(1.25) contrast(1.1)',warm:'saturate(1.5) hue-rotate(-12deg)'};
const FXN={none:'بدون فلتر',gray:'أبيض وأسود',sepia:'بني قديم',bright:'إضاءة قوية',warm:'دافئ'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=t=>$('st').textContent=t;
const total=()=>tl.reduce((s,c)=>s+(c.isV?Math.max(0,c.end-c.start):c.dur),0);

function load(f){
  return new Promise(res=>{
    const isV=f.type.startsWith('video'), url=URL.createObjectURL(f);
    const base={isV,url,name:f.name,dur:4,start:0,end:0,cap:'',filter:'none'};
    if(isV){
      const el=document.createElement('video'); el.playsInline=true; el.preload='auto';
      el.onloadedmetadata=()=>res({...base,el,end:isFinite(el.duration)?el.duration:10});
      el.src=url;
    }else{
      const el=new Image();
      el.onload=()=>res({...base,el});
      el.src=url;
    }
  });
}
fi.onchange=async e=>{
  msg('جاري التحميل…');
  for(const f of e.target.files) lib.push({id:++uid,...(await load(f))});
  e.target.value=''; msg(''); renderLib();
};

function renderLib(){
  $('cnt').textContent=lib.length?lib.length+' ملف':'';
  if(!lib.length) return $('lib').innerHTML='<div class="empty">لا توجد وسائط بعد — اضغط «استيراد»</div>';
  $('lib').innerHTML=lib.map((m,i)=>`<div class="th" title="${esc(m.name)}" onclick="addClip(${i})">${
    m.isV?`<video src="${m.url}" muted preload="metadata"></video><span class="badge">🎬</span>`:`<img src="${m.url}" alt="">`}</div>`).join('');
}
function addClip(i){
  const m=lib[i]; tl.push({...m,tid:++uid,start:m.start,end:m.end}); renderTL();
}
function addAll(){ lib.forEach((_,i)=>addClip(i)); }

function renderTL(){
  if(!tl.length){ $('tl').innerHTML='<div class="empty">الخط الزمني فارغ — أضف وسائط من المكتبة</div>'; $('tot').textContent=''; return; }
  $('tl').innerHTML=tl.map((c,i)=>`
  <div class="clip" draggable="true" data-i="${i}">
    ${c.isV?`<video src="${c.url}" muted preload="metadata"></video>`:`<img src="${c.url}" alt="">`}
    <div>
      <div class="small">${i+1}. ${esc(c.name)}</div>
      ${c.isV
        ?`<div class="row small">من <input type="number" step="0.1" min="0" value="${c.start.toFixed(1)}" style="width:70px" onchange="upd(${i},'start',+this.value)"> إلى <input type="number" step="0.1" value="${c.end.toFixed(1)}" style="width:70px" onchange="upd(${i},'end',+this.value)"> ث</div>`
        :`<div class="row small">المدة <input type="number" min="1" step="0.5" value="${c.dur}" style="width:70px" onchange="upd(${i},'dur',+this.value)"> ث</div>`}
      <input type="text" placeholder="عنوان / تعليق يظهر في الفيديو" value="${esc(c.cap)}" oninput="upd(${i},'cap',this.value)">
      <div class="row">
        <select onchange="upd(${i},'filter',this.value)">${Object.keys(FX).map(k=>`<option value="${k}" ${c.filter===k?'selected':''}>${FXN[k]}</option>`).join('')}</select>
        <button onclick="rm(${i})">✕ حذف</button>
      </div>
    </div>
  </div>`).join('');
  $('tot').textContent=`المدة الإجمالية: ${total().toFixed(1)} ث · ${tl.length} مقطع`;
  document.querySelectorAll('.clip').forEach(el=>{
    el.ondragstart=e=>{dragI=+el.dataset.i; e.dataTransfer.effectAllowed='move';};
    el.ondragover=e=>{e.preventDefault(); el.classList.add('over');};
    el.ondragleave=()=>el.classList.remove('over');
    el.ondrop=e=>{e.preventDefault(); const to=+el.dataset.i; const [m]=tl.splice(dragI,1); tl.splice(to,0,m); renderTL();};
  });
}
function upd(i,k,v){
  if(k==='cap'||k==='filter') tl[i][k]=v;
  else tl[i][k]=isNaN(v)?0:v;
  if(k!=='cap') renderTL();
}
function rm(i){ tl.splice(i,1); renderTL(); }

function audio(){
  if(!ac){
    ac=new (window.AudioContext||window.webkitAudioContext)();
    mix=ac.createMediaStreamDestination();
  }
  if(ac.state==='suspended') ac.resume();
  tl.forEach(c=>{
    if(c.isV && !c.el._n){
      c.el._n=ac.createMediaElementSource(c.el);
      c.el._n.connect(ac.destination);
      c.el._n.connect(mix);
    }
  });
}

function togglePlay(){ playing?finish():play(); }
function play(){
  if(!tl.length) return msg('أضف وسائط أولاً');
  audio(); playing=true; $('play').textContent='⏹ إيقاف';
  startClip(0); raf=requestAnimationFrame(frame);
}
function startClip(i){
  idx=i; const c=tl[i];
  if(!c) return finish();
  clipT0=performance.now();
  if(c.isV){ c.el.currentTime=c.start; c.el.play().catch(()=>{}); }
}
function frame(){
  if(!playing) return;
  const c=tl[idx];
  if(!c) return finish();
  const now=performance.now(), elapsed=(now-clipT0)/1000;
  let prog;
  if(c.isV){
    const ended=(now-clipT0>300)&&(c.el.ended||c.el.currentTime>=c.end-0.05);
    if(ended){ c.el.pause(); return nextClip(); }
    prog=Math.max(0,c.el.currentTime-c.start);
  }else{
    if(elapsed>=c.dur) return nextClip();
    prog=elapsed;
  }
  drawClip(c);
  const before=tl.slice(0,idx).reduce((s,x)=>s+(x.isV?Math.max(0,x.end-x.start):x.dur),0);
  $('pb').style.width=Math.min(100,(before+prog)/Math.max(total(),0.1)*100)+'%';
  raf=requestAnimationFrame(frame);
}
function nextClip(){
  if(idx+1<tl.length){ startClip(idx+1); raf=requestAnimationFrame(frame); }
  else finish();
}
function drawClip(c){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  const sw=c.isV?c.el.videoWidth:c.el.naturalWidth, sh=c.isV?c.el.videoHeight:c.el.naturalHeight;
  if(sw&&sh){
    const k=Math.min(W/sw,H/sh), dw=sw*k, dh=sh*k;
    ctx.filter=FX[c.filter]||'none';
    ctx.drawImage(c.el,(W-dw)/2,(H-dh)/2,dw,dh);
    ctx.filter='none';
  }
  if(c.cap){
    const g=ctx.createLinearGradient(0,H-170,0,H);
    g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.75)');
    ctx.fillStyle=g; ctx.fillRect(0,H-170,W,170);
    ctx.fillStyle='#fff'; ctx.font='bold 46px system-ui, sans-serif'; ctx.textAlign='center';
    ctx.fillText(c.cap,W/2,H-60);
  }
}
function finish(){
  playing=false; cancelAnimationFrame(raf);
  tl.forEach(c=>{ if(c.isV) c.el.pause(); });
  $('play').textContent='▶ تشغيل';
  if(rec && rec.state!=='inactive') rec.stop();
  else $('pb').style.width='0';
}

function exportFilm(){
  if(!tl.length) return msg('أضف وسائط أولاً');
  if(!window.MediaRecorder||!cv.captureStream) return msg('المتصفح لا يدعم التصدير');
  if(playing) finish();
  audio();
  const tracks=[...cv.captureStream(30).getVideoTracks(), ...mix.stream.getAudioTracks()];
  chunks=[];
  const type=MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')?'video/webm;codecs=vp8,opus':'video/webm';
  rec=new MediaRecorder(new MediaStream(tracks),{mimeType:type});
  rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  rec.onstop=()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));
    a.download='film-النشاط.webm'; document.body.appendChild(a); a.click(); a.remove();
    msg('✔ تم التصدير — الملف في التنزيلات'); rec=null;
  };
  rec.start();
  msg('⏺ جاري التسجيل بالوقت الحقيقي… لا تغلق الصفحة');
  play();
}
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
</html>
